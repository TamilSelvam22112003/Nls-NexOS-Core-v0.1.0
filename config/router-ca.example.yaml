server:
  host: "::"
  port: 4790
  control_id: "nls-router-ca"
  identity_key: "/var/lib/nls-nexos-core/identity/control-ed25519.key"
  policy_version: 1
  replay_window: 64
  max_clock_skew_seconds: 120
  session_timeout_seconds: 300
  key_rotation_seconds: 3600
database:
  path: "/var/lib/nls-nexos-core/router-registry.sqlite3"
pki:
  ca_certificate: "/etc/nls-nexos-core/pki/ca-root.crt"
  ca_private_key: "/etc/nls-nexos-core/pki/ca-signing.key"
  issued_cert_dir: "/var/lib/nls-nexos-core/issued"
enrollment:
  token_file: "/etc/nls-nexos-core/enrollment-token"
  certificate_days: 90
  max_request_bytes: 65536

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nls-nexos-core"
version = "0.1.0"
description = "NLS Router-CA enrollment and trust service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
nls-router-ca = "nls_nexos_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

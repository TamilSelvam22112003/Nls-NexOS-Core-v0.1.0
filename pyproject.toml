[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nls-nexos-core"
version = "0.1.0"
description = "NLS Router-CA enrollment and control-plane service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=41.0", "pydantic>=2.6", "PyYAML>=6.0", "cbor2>=5.6,<6"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
nls-router-ca = "nls_nexos_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/security"]
markers = ["integration: cross-repository or Linux network integration tests"]

name: Stage 7 Core Candidate Validation

on:
  push:
    branches:
      - spec/stage7-locator-clean
  pull_request:
    branches:
      - feat/nls-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-core-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core unit and security tests
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Run Core unit and security suite
        run: python -m pytest -q

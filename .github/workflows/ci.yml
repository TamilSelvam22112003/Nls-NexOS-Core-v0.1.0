name: Core CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: python -m compileall -q src tests
      - run: pytest -q tests/unit tests/security
  cross-repo-control-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
      - uses: actions/checkout@v4
        with:
          repository: TamilSelvam22112003/NlsxNetOS-v0.1.0
          path: nlsxnetos
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "core/.[test]" -r nlsxnetos/requirements.txt
      - run: PYTHONPATH="${{ github.workspace }}/core/src:${{ github.workspace }}/nlsxnetos" python -m pytest -q core/tests/integration/test_nls_control_cross_repo.py
